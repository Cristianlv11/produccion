{% extends "base.html" %}

{% block content %}
<div class="inv">
  <div class="inv-cabeza">
    <div>
      <h1>🛠️ Herramientas asignadas</h1>
      <p class="inv-sub">Qué herramientas tiene cada persona. Escríbalas separadas con comas.</p>
    </div>
  </div>

  {% include "_inventario_tabs.html" %}

  <div class="inv-herrs">
    {% for f in filas %}
    <article class="inv-herr" data-id="{{ f.id }}">
      <label>👤 Persona<input class="persona" value="{{ f.persona }}"></label>
      <label>🛠️ Herramientas{% if f.cantidad %} <small>({{ f.cantidad }})</small>{% endif %}<input class="herr" value="{{ f.herramientas }}"></label>
      <div class="inv-herr-botones">
        <button class="inv-btn primario btnGuardar" type="button">Guardar</button>
        <button class="inv-btn suave btnBorrar" type="button" aria-label="Borrar" style="color:#b91c1c">🗑️</button>
      </div>
    </article>
    {% endfor %}
    <article class="inv-herr nueva" data-id="">
      <label>👤 Persona nueva<input class="persona" placeholder="Nombre"></label>
      <label>🛠️ Herramientas<input class="herr" placeholder="Taladro, Pulidora…"></label>
      <div class="inv-herr-botones"><button class="inv-btn entra btnGuardar" type="button">＋ Agregar</button></div>
    </article>
  </div>
  <p class="inv-escaner-error" id="mensaje" style="margin-top:12px"></p>
</div>
<style>
  .inv-herrs { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  @media (max-width: 760px) { .inv-herrs { grid-template-columns: 1fr; } }
  .inv-herr { background: #fff; border: 1px solid var(--inv-borde); border-radius: 16px; padding: 14px; display: grid; gap: 10px; }
  .inv-herr.nueva { border-style: dashed; background: var(--inv-verde-claro); }
  .inv-herr label { display: grid; gap: 6px; font-weight: 700; font-size: .95rem; }
  .inv-herr label small { font-weight: 400; color: var(--inv-gris); }
  .inv-herr input { min-height: 46px; padding: 0 12px; border: 1px solid var(--inv-borde); border-radius: 12px; font: inherit; font-weight: 400; }
  .inv-herr-botones { display: flex; gap: 8px; }
  .inv-herr-botones .btnGuardar { flex: 1; }
</style>
<script>
document.querySelectorAll('.inv-herr').forEach(card => {
  const g = card.querySelector('.btnGuardar'), b = card.querySelector('.btnBorrar');
  g.onclick = async () => {
    const r = await invPost('/inventario/herramientas', { id: card.dataset.id || null,
      persona: card.querySelector('.persona').value, herramientas: card.querySelector('.herr').value });
    if (r.ok) location.reload(); else document.getElementById('mensaje').textContent = r.error;
  };
  if (b) b.onclick = async () => {
    if (!confirm('¿Borrar las herramientas de ' + card.querySelector('.persona').value + '?')) return;
    const r = await invPost('/inventario/herramientas', { id: card.dataset.id, borrar: true });
    if (r.ok) location.reload(); else document.getElementById('mensaje').textContent = r.error;
  };
});
</script>
{% endblock %}
