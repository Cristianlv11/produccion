<!DOCTYPE html>
<html>
<head>
    <meta name="csrf-token" content="{{ request.session.csrf_token }}">
    <script>
    (function() {
        const originalFetch = window.fetch;
        window.fetch = async function() {
            let [resource, config] = arguments;
            if (config && config.method && ['POST', 'PUT', 'PATCH', 'DELETE'].includes(config.method.toUpperCase())) {
                const tokenMeta = document.querySelector('meta[name="csrf-token"]');
                if (tokenMeta) {
                    config.headers = config.headers || {};
                    if (config.headers instanceof Headers) {
                        config.headers.append('X-CSRF-Token', tokenMeta.content);
                    } else {
                        config.headers['X-CSRF-Token'] = tokenMeta.content;
                    }
                }
            }
            return originalFetch(resource, config);
        };
    })();
    </script>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="utf-8">
<title>Cambiar password</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/static/styles.css?v=20261111d">
</head>
<body class="login-page-body">

<div class="login-container">
    <img src="/static/logo.png" alt="Logo">

    <h2>Cambiar password</h2>
    <p>Antes de registrar produccion debes crear tu password personal.</p>

    {% if error %}
    <div style="background: #fee2e2; color: var(--danger); padding: 10px; border-radius: var(--radius-md); margin-bottom: 1.5rem; font-size: 0.875rem; font-weight: 500; border: 1px solid var(--bg-surface);">
        {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/cambiar_password">
    <input type="hidden" name="csrf_token" value="{{ request.session.csrf_token }}">
        <div class="form-group">
            <label>Nuevo password</label>
            <input type="password" name="nueva_password" placeholder="Nuevo password" required minlength="4">
        </div>

        <div class="form-group">
            <label>Confirmar password</label>
            <input type="password" name="confirmar_password" placeholder="Confirmar password" required minlength="4">
        </div>

        <button type="submit" class="login-btn">Guardar password</button>
    </form>
</div>

</body>
</html>
