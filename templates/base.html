<!DOCTYPE html>
<html>
<head>
    <meta name="csrf-token" content="{{ request.session.csrf_token }}">
    <script>
    (function() {
        const originalFetch = window.fetch;
        window.fetch = async function() {
            let [resource, config] = arguments;
            if (config && config.method && ['POST', 'PUT', 'PATCH', 'DELETE'].includes(config.method.toUpperCase())) {
                const tokenMeta = document.querySelector('meta[name="csrf-token"]');
                if (tokenMeta) {
                    config.headers = config.headers || {};
                    if (config.headers instanceof Headers) {
                        config.headers.append('X-CSRF-Token', tokenMeta.content);
                    } else {
                        config.headers['X-CSRF-Token'] = tokenMeta.content;
                    }
                }
            }
            return originalFetch(resource, config);
        };
    })();
    </script>
