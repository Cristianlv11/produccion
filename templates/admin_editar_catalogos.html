{% extends "base.html" %}

{% block content %}


<div class="header-actions" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <div>
        <h1 style="margin:0; font-size:24px; color:var(--text-dark);">Mantenimiento de Catálogos</h1>
        <p style="color: #64748b; margin-top: 4px;">Edita, crea o elimina ítems base del sistema de forma segura.</p>
    </div>
    <a href="/configuracion" class="btn-cancel" style="text-decoration: none;">&larr; Volver a Configuración</a>
</div>

<div class="tabs-container" id="tabs">
    <button class="tab-btn active" onclick="switchTab('operarios')">Operarios</button>
    <button class="tab-btn" onclick="switchTab('maquinas')">Máquinas</button>
    <button class="tab-btn" onclick="switchTab('procesos')">Procesos</button>
    <button class="tab-btn" onclick="switchTab('actividades')">Actividades</button>
    <button class="tab-btn" onclick="switchTab('estandares')">Estándares</button>
</div>

<div class="header-actions" style="margin-bottom: 15px;">
    <h2 id="currentTabTitle" style="font-size: 18px; margin: 0; color: #334155;">Cargando...</h2>
    <button id="btnNew" class="btn-new" onclick="openModalNew()">
        <span>+</span> Nuevo
    </button>
</div>

<div class="table-wrapper">
<div class="table-responsive">
    <table id="dataTable" class="table-striped">
        <thead id="dataHead"></thead>
        <tbody id="dataBody">
            <tr><td colspan="10" class="empty-state">Cargando datos...</td></tr>
        </tbody>
    </table>
</div>
</div>

<div class="toast-container" id="toastContainer"></div>

<!-- MODAL GENÉRICO -->
<div class="modal" id="editorModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">Crear/Editar</h2>
            <button class="close-btn" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body" id="modalForm">
            <!-- Dynamic fields go here -->
        </div>
        <div class="modal-footer">
            <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
            <button class="btn-save" id="btnSave" onclick="saveData()">
                <span id="saveText">Guardar</span>
            </button>
        </div>
    </div>
</div>

<script>
let currentTab = 'operarios';
let currentData = [];
let editingId = null;

// Catálogos auxiliares para los dropdowns
let auxMaquinas = [];
let auxProcesos = [];

const TAB_CONFIG = {
    operarios: {
        title: "Operarios",
        endpoint: "/config/operarios",
        canCreate: true,
        canDelete: true,
        cols: [
            { key: "id", label: "ID" },
            { key: "nombre", label: "Nombre" },
            { key: "area", label: "Área" },
            { key: "activo", label: "Estado" }
        ],
        fields: [
            { key: "nombre", label: "Nombre del Operario", type: "text", required: true },
            { key: "area", label: "Área (Soldadura, Pintura, Ensamble 1…). Agrupa la lista en la app", type: "text", required: false }
        ]
    },
    maquinas: {
        title: "Máquinas",
        endpoint: "/config/maquinas",
        canCreate: true,
        canDelete: true,
        cols: [
            { key: "id", label: "ID" },
            { key: "nombre", label: "Nombre" }
        ],
        fields: [
            { key: "nombre", label: "Nombre de la Máquina", type: "text", required: true }
        ]
    },
    procesos: {
        title: "Procesos",
        endpoint: "/config/procesos",
        canCreate: true,
        canDelete: true,
        cols: [
            { key: "id", label: "ID" },
            { key: "maquina_nombre", label: "Máquina" },
            { key: "nombre", label: "Nombre Proceso" }
        ],
        fields: [
            { key: "maquina_id", label: "Máquina", type: "select", options: 'auxMaquinas', required: true },
            { key: "nombre", label: "Nombre del Proceso", type: "text", required: true }
        ]
    },
    actividades: {
        title: "Actividades",
        endpoint: "/config/actividades",
        canCreate: true,
        canDelete: true,
        cols: [
            { key: "id", label: "ID" },
            { key: "proceso_nombre", label: "Proceso Padre" },
            { key: "nombre", label: "Nombre Actividad" }
        ],
        fields: [
            { key: "proceso_id", label: "Proceso", type: "select", options: 'auxProcesos', required: true },
            { key: "nombre", label: "Nombre de la Actividad", type: "text", required: true },
            // Los estandares solo se piden al crear, no al editar (se editan en su pestaña)
            { key: "minutos_unidad", label: "¿Cuántos minutos toma hacer una unidad?", type: "number", required: true, createOnly: true }
        ]
    },
    estandares: {
        title: "Estándares de Actividades",
        endpoint: "/config/estandares",
        canCreate: false, // Se crean junto con la actividad
        canDelete: false, // Mueren con la actividad
        cols: [
            { key: "id", label: "ID" },
            { key: "actividad_nombre", label: "Actividad" },
            { key: "minutos_unidad", label: "Min / unidad" },
            { key: "costo_mo_unidad", label: "Costo Unidad" },
            { key: "costo_mo_hora", label: "Costo Hora" }
        ],
        fields: [
            // El ID de actividad no se edita aquí, solo los números
            { key: "minutos_unidad", label: "Minutos por unidad (el costo se calcula solo)", type: "number", required: true }
        ]
    }
};

function showToast(message, type = 'success') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.innerHTML = message;
    container.appendChild(toast);
    setTimeout(() => {
        toast.style.animation = 'slideOut 0.3s ease forwards';
        setTimeout(() => toast.remove(), 300);
    }, 4000);
}

async function loadDependencies() {
    try {
        const reqM = await fetch('/config/maquinas');
        const resM = await reqM.json();
        if(resM.ok) auxMaquinas = resM.data;
        
        const reqP = await fetch('/config/procesos');
        const resP = await reqP.json();
        if(resP.ok) auxProcesos = resP.data;
    } catch(e) {
        console.error("Error cargando dependencias", e);
    }
}

async function switchTab(tabId) {
    currentTab = tabId;
    
    // Update active UI
    document.querySelectorAll('.tab-btn').forEach(btn =>
        btn.classList.toggle('active', btn.getAttribute('onclick') === `switchTab('${tabId}')`));
    
    const config = TAB_CONFIG[tabId];
    document.getElementById('currentTabTitle').innerText = config.title;
    document.getElementById('btnNew').style.display = config.canCreate ? 'inline-flex' : 'none';
    
    await renderTable();
}

async function renderTable() {
    const tbody = document.getElementById('dataBody');
    const thead = document.getElementById('dataHead');
    const config = TAB_CONFIG[currentTab];
    
    // Skeletons
    let skelHtml = '';
    for(let i=0; i<4; i++) {
        skelHtml += '<tr>';
        config.cols.forEach(c => { skelHtml += `<td><div class="skeleton skeleton-text"></div></td>`; });
        skelHtml += `<td><div class="skeleton skeleton-text" style="width: 80px;"></div></td></tr>`;
    }
    tbody.innerHTML = skelHtml;
    
    // Render Head
    let headHtml = '<tr>';
    config.cols.forEach(c => { headHtml += `<th>${c.label}</th>`; });
    headHtml += '<th>Acciones</th></tr>';
    thead.innerHTML = headHtml;
    
    try {
        const res = await fetch(config.endpoint);
        const json = await res.json();
        
        if (!res.ok) throw new Error(json.detail || "Error cargando datos");
        
        currentData = json.data || [];
        
        if (currentData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="${config.cols.length + 1}" class="empty-state">No hay registros</td></tr>`;
            return;
        }
        
        let bodyHtml = '';
        currentData.forEach(row => {
            bodyHtml += '<tr>';
            config.cols.forEach(c => {
                let val = row[c.key] !== null ? row[c.key] : '';
                if(c.key === 'id') {
                    bodyHtml += `<td><span class="id-badge">#${val}</span></td>`;
                } else if(c.key === 'activo') {
                    if (val === true) {
                        bodyHtml += `<td><span style="background:#dcfce7;color:#16a34a;padding:2px 8px;border-radius:12px;font-size:12px;font-weight:700;">Activo</span></td>`;
                    } else if (val === false) {
                        bodyHtml += `<td><span style="background:#f1f5f9;color:#64748b;padding:2px 8px;border-radius:12px;font-size:12px;font-weight:700;">Inactivo</span></td>`;
                    } else {
                        bodyHtml += `<td></td>`;
                    }
                } else {
                    bodyHtml += `<td>${val}</td>`;
                }
            });
            
            let deleteBtnLabel = "Eliminar";
            let showDeleteBtn = config.canDelete;
            if (currentTab === 'operarios') {
                deleteBtnLabel = "🚫 Desactivar";
                // Si ya está inactivo, ocultamos el botón
                if (row.activo === false) {
                    showDeleteBtn = false;
                }
            }

            bodyHtml += `
                <td>
                    <div class="action-buttons">
                        <button class="btn-edit" onclick="openModalEdit(${row.id})">Editar</button>
                        ${showDeleteBtn ? `<button class="btn-delete" onclick="deleteItem(${row.id})">${deleteBtnLabel}</button>` : ''}
                    </div>
                </td>
            `;
            bodyHtml += '</tr>';
        });
        tbody.innerHTML = bodyHtml;
        
    } catch(e) {
        tbody.innerHTML = `<tr><td colspan="10" class="empty-state" style="color:var(--danger)">${e.message}</td></tr>`;
        showToast(e.message, 'error');
    }
}

function openModalNew() {
    editingId = null;
    const config = TAB_CONFIG[currentTab];
    document.getElementById('modalTitle').innerText = `Nuevo ${config.title.slice(0,-1)}`;
    renderForm(config.fields, {});
    document.getElementById('editorModal').classList.add('active');
}

function openModalEdit(id) {
    editingId = id;
    const config = TAB_CONFIG[currentTab];
    document.getElementById('modalTitle').innerText = `Editar ${config.title.slice(0,-1)} #${id}`;
    
    const rowData = currentData.find(r => r.id === id);
    renderForm(config.fields, rowData);
    document.getElementById('editorModal').classList.add('active');
}

function closeModal() {
    document.getElementById('editorModal').classList.remove('active');
}

function renderForm(fields, data) {
    const formContainer = document.getElementById('modalForm');
    let html = '';
    
    fields.forEach(f => {
        // Skip createOnly fields if we are editing
        if (editingId !== null && f.createOnly) return;
        
        const val = data[f.key] !== undefined && data[f.key] !== null ? data[f.key] : '';
        
        html += `<div class="form-group">`;
        html += `<label>${f.label} ${f.required ? '<span style="color:var(--danger)">*</span>' : ''}</label>`;
        
        if (f.type === 'select') {
            html += `<select id="field_${f.key}" ${f.required ? 'required' : ''}>`;
            html += `<option value="">Seleccione...</option>`;
            
            let optionsSource = [];
            if(f.options === 'auxMaquinas') optionsSource = auxMaquinas;
            if(f.options === 'auxProcesos') optionsSource = auxProcesos;
            
            optionsSource.forEach(opt => {
                const selected = (String(opt.id) === String(val)) ? 'selected' : '';
                // For procesos dropdown, show machine name too if available
                const labelStr = opt.maquina_nombre ? `[${opt.maquina_nombre}] ${opt.nombre}` : opt.nombre;
                html += `<option value="${opt.id}" ${selected}>${labelStr}</option>`;
            });
            html += `</select>`;
        } else {
            html += `<input type="${f.type}" id="field_${f.key}" value="${val}" ${f.required ? 'required' : ''} step="0.01">`;
        }
        html += `</div>`;
    });
    
    formContainer.innerHTML = html;
}

async function saveData() {
    const config = TAB_CONFIG[currentTab];
    let payload = {};
    
    // Gather data
    for (let f of config.fields) {
        if (editingId !== null && f.createOnly) continue;
        
        const el = document.getElementById(`field_${f.key}`);
        if(el) {
            let val = el.value.trim();
            if(f.required && !val) {
                showToast(`El campo ${f.label} es obligatorio`, 'error');
                return;
            }
            if(f.type === 'number' && val) val = parseFloat(val);
            payload[f.key] = val;
        }
    }
    
    const btn = document.getElementById('btnSave');
    const text = document.getElementById('saveText');
    btn.disabled = true;
    text.innerHTML = 'Guardando<div class="spinner"></div>';
    
    try {
        let url = config.endpoint;
        let method = 'POST';
        
        if (editingId !== null) {
            url = `${config.endpoint}/${editingId}`;
            method = 'PUT';
        }
        
        const res = await fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        
        const json = await res.json();
        
        if (!res.ok) throw new Error(json.detail || "Error al guardar");
        
        showToast('Guardado correctamente', 'success');
        closeModal();
        
        // Refresh dependencies if we changed a maquina or proceso
        if (currentTab === 'maquinas' || currentTab === 'procesos') {
            await loadDependencies();
        }
        await renderTable();
        
    } catch(e) {
        showToast(e.message, 'error');
    } finally {
        btn.disabled = false;
        text.innerHTML = 'Guardar';
    }
}

async function deleteItem(id) {
    if(!confirm('¿Estás seguro de que deseas eliminar este ítem? Esto podría afectar la integridad de los datos.')) return;
    
    const config = TAB_CONFIG[currentTab];
    
    try {
        const res = await fetch(`${config.endpoint}/${id}`, {
            method: 'DELETE'
        });
        
        const json = await res.json();
        
        if (!res.ok) {
            // Throw specific error messages exactly as returned by the backend (409 Conflict handled here)
            throw new Error(json.detail || "No se pudo eliminar");
        }
        
        showToast(json.mensaje || 'Ítem eliminado correctamente', 'success');
        
        if (currentTab === 'maquinas' || currentTab === 'procesos') {
            await loadDependencies();
        }
        await renderTable();
        
    } catch(e) {
        showToast(e.message, 'error');
    }
}

// Inicialización
window.onload = async () => {
    // Initial fetch of dependent catalogs
    await loadDependencies();
    // Start with the default tab (which initializes UI & fetches table data)
    const tabUrl = new URLSearchParams(location.search).get('tab');
    switchTab(tabUrl || currentTab);
};
</script>
{% endblock %}
