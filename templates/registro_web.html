<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="csrf-token" content="{{ request.session.csrf_token }}">
    <script>
    (function() {
        const originalFetch = window.fetch;
        window.fetch = async function() {
            let [resource, config] = arguments;
            if (config && config.method && ['POST', 'PUT', 'PATCH', 'DELETE'].includes(config.method.toUpperCase())) {
                const tokenMeta = document.querySelector('meta[name="csrf-token"]');
                if (tokenMeta) {
                    config.headers = config.headers || {};
                    if (config.headers instanceof Headers) {
                        config.headers.append('X-CSRF-Token', tokenMeta.content);
                    } else {
                        config.headers['X-CSRF-Token'] = tokenMeta.content;
                    }
                }
            }
            return originalFetch(resource, config);
        };
    })();
    </script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Registro Producción</title>
<link rel="stylesheet" href="/static/styles.css?v=20261111d">
nt;
    }
    h2, h3 {
        font-size: 1.2rem !important;
    }
}
</style>

</head>
<body>

<div id="topbar">
  <div class="title">Registro <span>Producción</span></div>
  <div style="display:flex; gap:10px; align-items:center;">
    <a href="/inicio_operario" style="background:var(--bg-body); color:var(--text-muted); padding:6px 12px; border-radius:8px; text-decoration:none; font-weight:700; font-size:13px; border:1px solid var(--border-color);">🏠 Menú</a>
    <div id="estadoPill">Listo</div>
  </div>
</div>

<div class="reg-main" id="main">

  <div id="right" class="reg-panel">
    <div id="timerBox">
      <div id="timerLabel">Tiempo Transcurrido</div>
      <div id="cronometro">00:00:00</div>
      <input id="inicioInput" type="hidden">
    </div>
    <div id="summary">
      <div class="sumrow"><strong>Orden Abierta</strong><span id="resOrden">—</span></div>
      <div class="sumrow"><strong>Actividad Actual</strong><span id="resActividad">—</span></div>
    </div>
  </div>

  <div id="left" class="reg-panel">
    <div class="reg-field">
      <label>Operario en Turno</label>
      <div class="reg-sel-wrap"><select id="operarioSelect" disabled><option value="{{ operario_actual.id }}">{{ operario_actual.nombre }}</option></select></div>
    </div>
    <div class="reg-field">
      <label>Seleccionar Orden</label>
      <div class="reg-sel-wrap"><select id="ordenSelect"><option value="">Cargando...</option></select></div>
    </div>
    <div class="reg-field-row">
      <div class="reg-field"><label>Seleccionar Proceso</label><div class="reg-sel-wrap"><select id="procesoSelect" disabled></select></div></div>
      <div class="reg-field"><label>Seleccionar Actividad</label><div class="reg-sel-wrap"><select id="actividadSelect" disabled></select></div></div>
    </div>
    
    <div id="mensaje"></div>

    <div id="actions">
      <button class="reg-btn" id="btnIniciar" onclick="iniciarRegistro()">▶ Iniciar Producción</button>
      <button class="reg-btn" id="btnGuardar" onclick="guardarRegistro()" style="display:none;">💾 Guardar Final</button>
      <button class="reg-btn" id="btnCancelar" onclick="cancelarRegistro()" style="display:none;">✕ Cancelar</button>
      <button class="reg-btn" id="btnRecargar" onclick="recargarDatos()">↺ Sincronizar Datos</button>
    </div>
  </div>

</div>

<!-- Modal -->
<div id="reg-modal">
  <div id="reg-modalBox">
    <h2>Unidades Producidas</h2>
    <p>Ingresa la cantidad final (usa 0 si es una pausa o detención).</p>
    <input id="modalCantidadInput" type="number" min="0" step="1" inputmode="numeric" placeholder="0">
    <div class="modal-btns">
      <button class="btn-modal-cancel" onclick="cerrarModal()">Cancelar</button>
      <button class="btn-modal-ok" onclick="confirmarCantidad()">Guardar Final</button>
    </div>
  </div>
</div>

<div id="loadingOverlay"><div class="reg-spinner"></div><span id="loadingText">Sincronizando...</span></div>

<script>
const operarioSesion = {{ operario_actual | tojson }};
let operarios = [operarioSesion];
let maquinas = [], ordenes = [], procesos = [], actividades = [];
let inicioRegistro = null, timerId = null, bloqueado = false;

function pad(n){ return String(n).padStart(2,'0'); }
function formatoLocal(f){
  return f.getFullYear()+'-'+pad(f.getMonth()+1)+'-'+pad(f.getDate())+' '+pad(f.getHours())+':'+pad(f.getMinutes())+':'+pad(f.getSeconds());
}
function formatoCrono(s){ return pad(Math.floor(s/3600))+':'+pad(Math.floor((s%3600)/60))+':'+pad(s%60); }
function setEstado(txt, cls){ const p=document.getElementById('estadoPill'); p.textContent=txt; p.className=cls||''; }
function mostrarMensaje(txt, tipo){ const b=document.getElementById('mensaje'); b.textContent=txt; b.className=tipo||''; }
function loading(v, txt){ document.getElementById('loadingText').textContent=txt||'Cargando...'; document.getElementById('loadingOverlay').classList.toggle('visible',v); }

function normMaq(i){ return Array.isArray(i)?{id:i[0],nombre:i[1]}:i; }
function normOrden(i){
  if(!Array.isArray(i)) return i;
  const maq = maquinas.find(m=>String(m.id)===String(i[1]));
  return {id:i[0], maquina_id:i[1], producto:maq?maq.nombre:'Máq. '+i[1]};
}
function normBasic(i){ return Array.isArray(i)?{id:i[0],nombre:i[1]}:i; }

function llenarSelect(sel, datos, ph, labelFn){
  sel.innerHTML='';
  const o=document.createElement('option'); o.value=''; o.textContent=ph; sel.appendChild(o);
  datos.forEach(item=>{ const opt=document.createElement('option'); opt.value=item.id; opt.textContent=labelFn?labelFn(item):item.nombre; sel.appendChild(opt); });
}

async function fetchConReintento(url, options={}, reintentos=3){
  for(let i=0; i<reintentos; i++){
    try{ return await fetch(url, options); }
    catch(e){ await new Promise(r=>setTimeout(r, 1000)); }
  }
  throw new Error("No hay internet (timeout). Revise su conexión.");
}

async function cargarJson(url){
  const r = await fetchConReintento(url);
  const txt = await r.text();
  let data; try{ data=JSON.parse(txt); }catch(_){ data={detail:txt}; }
  if(!r.ok) throw new Error(data.detail||'Error de red');
  return data;
}

// PERSISTENCIA LOCALSTORAGE (ANTI-CIERRE IOS)
const STORAGE_KEY = 'estado_registro_' + operarioSesion.id;
function guardarEstadoLocal() {
  if (!inicioRegistro) { localStorage.removeItem(STORAGE_KEY); return; }
  const state = {
    inicio: inicioRegistro.getTime(),
    orden: document.getElementById('ordenSelect').value,
    proceso: document.getElementById('procesoSelect').value,
    actividad: document.getElementById('actividadSelect').value
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}
function limpiarEstadoLocal() { localStorage.removeItem(STORAGE_KEY); }

async function recargarDatos(){
  try{
    loading(true,'Sincronizando datos...');
    maquinas = (await cargarJson('/maquinas')).map(normMaq);
    ordenes  = (await cargarJson('/ordenes')).map(normOrden);
    llenarSelect(document.getElementById('operarioSelect'), operarios, '—');
    document.getElementById('operarioSelect').value = operarioSesion.id||'';
    llenarSelect(document.getElementById('ordenSelect'), ordenes, ordenes.length?'Seleccione una orden':'No hay órdenes abiertas', o=>'#'+o.id+' — '+o.producto);
    limpiarPA(); setEstado('Listo',''); actualizarResumen(); mostrarMensaje('','');
    
    // Auto-restaurar estado si iOS cerró la app
    await intentarRestaurar();
  }catch(e){ setEstado('Desconectado','error'); mostrarMensaje(e.message,'error'); }
  finally{ loading(false); }
}

async function intentarRestaurar() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (!saved) return;
  try {
    const state = JSON.parse(saved);
    if (!state.inicio || !state.orden) return;
    
    // Verificar que la orden aún existe y está abierta
    if (!ordenes.find(o => String(o.id) === String(state.orden))) {
      limpiarEstadoLocal(); return; 
    }
    
    document.getElementById('ordenSelect').value = state.orden;
    await cargarProcesos(false);
    if (state.proceso) document.getElementById('procesoSelect').value = state.proceso;
    await cargarActividades(false);
    if (state.actividad) document.getElementById('actividadSelect').value = state.actividad;
    
    actualizarResumen();
    
    // Retomar Cronómetro
    inicioRegistro = new Date(state.inicio);
    arrancarReloj();
    mostrarMensaje('Se ha recuperado tu registro en curso.', 'ok');
  } catch(e) { limpiarEstadoLocal(); }
}

function limpiarPA(){
  procesos=[]; actividades=[];
  llenarSelect(document.getElementById('procesoSelect'),[],'— seleccione orden —');
  llenarSelect(document.getElementById('actividadSelect'),[],'—');
  document.getElementById('procesoSelect').disabled=true;
  document.getElementById('actividadSelect').disabled=true;
}

async function cargarProcesos(saveLocal = true){
  const oid = document.getElementById('ordenSelect').value;
  llenarSelect(document.getElementById('actividadSelect'),[],'—');
  document.getElementById('actividadSelect').disabled=true;
  if(!oid){ limpiarPA(); actualizarResumen(); if(saveLocal)guardarEstadoLocal(); return; }
  try{
    procesos=(await cargarJson('/procesos/'+oid)).map(normBasic);
    llenarSelect(document.getElementById('procesoSelect'),procesos, procesos.length?'Seleccionar proceso':'—');
    document.getElementById('procesoSelect').disabled=procesos.length===0||bloqueado;
    actualizarResumen(); if(saveLocal)guardarEstadoLocal();
  }catch(e){ mostrarMensaje(e.message,'error'); }
}

async function cargarActividades(saveLocal = true){
  const oid=document.getElementById('ordenSelect').value; const pid=document.getElementById('procesoSelect').value;
  if(!oid||!pid){ llenarSelect(document.getElementById('actividadSelect'),[],'—'); document.getElementById('actividadSelect').disabled=true; actualizarResumen(); if(saveLocal)guardarEstadoLocal(); return; }
  try{
    actividades=(await cargarJson('/actividades/'+oid+'/'+pid)).map(normBasic);
    llenarSelect(document.getElementById('actividadSelect'),actividades, actividades.length?'Seleccionar actividad':'—');
    document.getElementById('actividadSelect').disabled=actividades.length===0||bloqueado;
    actualizarResumen(); if(saveLocal)guardarEstadoLocal();
  }catch(e){ mostrarMensaje(e.message,'error'); }
}

function selActual(){
  return {
    orden: ordenes.find(x=>String(x.id)===document.getElementById('ordenSelect').value),
    actividad: actividades.find(x=>String(x.id)===document.getElementById('actividadSelect').value)
  };
}
function actualizarResumen(){
  const s=selActual();
  document.getElementById('resOrden').textContent = s.orden?'#'+s.orden.id+' — '+s.orden.producto:'—';
  document.getElementById('resActividad').textContent = s.actividad?s.actividad.nombre:'—';
}
function setBloqueo(v){
  bloqueado=v;
  ['operarioSelect','ordenSelect','procesoSelect','actividadSelect'].forEach(id=>{
    const el=document.getElementById(id);
    el.disabled = id==='operarioSelect'||v||(id==='procesoSelect'&&procesos.length===0)|(id==='actividadSelect'&&actividades.length===0);
  });
}

function arrancarReloj() {
  document.getElementById('inicioInput').value = formatoLocal(inicioRegistro);
  document.getElementById('cronometro').classList.add('running');
  document.getElementById('timerBox').classList.add('running');
  if(timerId) clearInterval(timerId);
  timerId = setInterval(()=>{
    const s=Math.max(0,Math.floor((new Date()-inicioRegistro)/1000));
    document.getElementById('cronometro').textContent=formatoCrono(s);
  }, 1000);
  setBloqueo(true);
  document.getElementById('btnIniciar').style.display='none';
  document.getElementById('btnGuardar').style.display='flex';
  document.getElementById('btnCancelar').style.display='flex';
  setEstado('En curso','running');
}

function iniciarRegistro(){
  const s=selActual();
  if(!s.orden || !s.actividad){ mostrarMensaje('Seleccione orden, proceso y actividad.','error'); return; }
  inicioRegistro=new Date();
  guardarEstadoLocal();
  arrancarReloj();
  mostrarMensaje('','');
}

function cancelarRegistro(){
  if(confirm("¿Seguro que deseas cancelar? El tiempo transcurrido NO se guardará.")){
    clearInterval(timerId); timerId=null; inicioRegistro=null;
    limpiarEstadoLocal();
    document.getElementById('inicioInput').value='';
    document.getElementById('cronometro').textContent='00:00:00';
    document.getElementById('cronometro').classList.remove('running');
    document.getElementById('timerBox').classList.remove('running');
    setBloqueo(false);
    document.getElementById('btnIniciar').style.display='flex';
    document.getElementById('btnGuardar').style.display='none';
    document.getElementById('btnCancelar').style.display='none';
    setEstado('Listo','');
    mostrarMensaje('Registro cancelado.', 'error');
  }
}

function guardarRegistro(){
  if(!inicioRegistro) return;
  document.getElementById('modalCantidadInput').value='';
  document.getElementById('reg-modal').classList.add('visible');
  setTimeout(()=>document.getElementById('modalCantidadInput').focus(),100);
}
function cerrarModal(){ document.getElementById('reg-modal').classList.remove('visible'); }

async function confirmarCantidad(){
  const txt=document.getElementById('modalCantidadInput').value.trim();
  if(txt==='') return;
  const cant=Number(txt);
  if(!Number.isFinite(cant)||cant<0||!Number.isInteger(cant)){ alert('Ingrese una cantidad válida (número entero).'); return; }
  cerrarModal();
  const s=selActual(), fin=new Date();
  const payload={
    orden_id:s.orden.id, actividad_id:s.actividad.id, cantidad:cant,
    inicio:formatoLocal(inicioRegistro), fin:formatoLocal(fin),
    tiempo:Math.max(0,Math.floor((fin-inicioRegistro)/1000))
  };
  try{
    loading(true,'Enviando a la nube...'); setEstado('Guardando...','saving');
    document.getElementById('btnGuardar').disabled=true;
    
    const r=await fetchConReintento('/registro_web/registro',{
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)
    });
    const txt2=await r.text(); let data; try{ data=JSON.parse(txt2); }catch(_){ data={detail:txt2}; }
    if(r.status===401){ document.getElementById('btnGuardar').disabled=false; throw new Error("Sesión expirada. Inicie sesión nuevamente."); }
    if(!r.ok){ document.getElementById('btnGuardar').disabled=false; throw new Error(data.detail||'Error guardando en el servidor.'); }
    
    clearInterval(timerId); timerId=null; inicioRegistro=null;
    limpiarEstadoLocal(); // ¡Se limpia al guardar exitosamente!
    document.getElementById('cronometro').textContent='00:00:00';
    document.getElementById('cronometro').classList.remove('running');
    document.getElementById('timerBox').classList.remove('running');
    document.getElementById('inicioInput').value='';
    setBloqueo(false);
    document.getElementById('btnIniciar').style.display='flex';
    document.getElementById('btnGuardar').style.display='none';
    document.getElementById('btnGuardar').disabled=false;
    document.getElementById('btnCancelar').style.display='none';
    await recargarDatos();
    setEstado('Guardado ✓','saved'); mostrarMensaje('Registro guardado exitosamente.','ok');
  }catch(e){
    document.getElementById('btnGuardar').disabled=false;
    setEstado('Error red','error'); mostrarMensaje(e.message,'error');
  }finally{ loading(false); }
}

document.getElementById('modalCantidadInput').addEventListener('keydown',e=>{ if(e.key==='Enter') confirmarCantidad(); if(e.key==='Escape') cerrarModal(); });
document.getElementById('ordenSelect').addEventListener('change',()=>cargarProcesos(true));
document.getElementById('procesoSelect').addEventListener('change',()=>cargarActividades(true));
document.getElementById('actividadSelect').addEventListener('change',()=> { actualizarResumen(); guardarEstadoLocal(); });

recargarDatos();
</script>
</body>
</html>
